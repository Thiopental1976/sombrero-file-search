# SFS para Windows — F0 (desenho do Fable, 02/10/2026).
# Runner windows-latest com os motores oficiais de Windows em bin/ (a mesma pasta
# que o .deb e o AppImage usam ao lado de lfs/). Mede, não esconde: o que ainda
# é só-Linux aparece como falha listada no passo "auditoria (informativo)".
name: windows

on:
  push:
    branches: [windows, main]
  pull_request:
  workflow_dispatch:

env:
  RGV: "15.2.0"      # manter em sincronia com install.sh / build_appimage.sh
  FDV: "v10.4.2"
  # rga: o 0.10.10 (Linux) não publicou build de Windows; 0.10.9 é o último
  # que publicou. Medido 02/10/2026: o leitor docx/odt/epub do SFS (custom
  # adapter) passa test_docs_embutidos no 0.10.9 também.
  RGAV: "v0.10.9"
  POPPLERV: "26.09.0-0"
  PYTHONUTF8: "1"

jobs:
  testes:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: motores (rg, fd, rga, pdftotext) em bin\
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force bin, _dl | Out-Null
          # 24/11/2026 (pedido do Rodrigo): SHA256 FIXADO de cada download. Arquivo
          # corrompido ou trocado na origem para a montagem, em vez de ir para o pacote.
          # Ao subir uma versão (RGV/FDV/RGAV/POPPLERV), atualizar o hash junto.
          # rg, fd e poppler conferem com o digest publicado pelo GitHub; o rga 0.10.9
          # é anterior aos digests: hash medido em 24/11/2026.
          function Baixa($url, $zip, $sha) {
            Invoke-WebRequest -Uri $url -OutFile "_dl\$zip"
            $h = (Get-FileHash "_dl\$zip" -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $sha) { throw "SHA256 de $zip nao confere: veio $h, esperado $sha" }
            "sha256 ok  $zip"
            Expand-Archive "_dl\$zip" -DestinationPath "_dl\$($zip -replace '\.zip$','')" -Force
          }
          Baixa "https://github.com/BurntSushi/ripgrep/releases/download/$env:RGV/ripgrep-$env:RGV-x86_64-pc-windows-msvc.zip" rg.zip 71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5
          Baixa "https://github.com/sharkdp/fd/releases/download/$env:FDV/fd-$env:FDV-x86_64-pc-windows-msvc.zip" fd.zip b2816e506390a89941c63c9187d58a3cc10e9a55f2ef0685f9ea0eccaf7c98c8
          Baixa "https://github.com/phiresky/ripgrep-all/releases/download/$env:RGAV/ripgrep_all-$env:RGAV-x86_64-pc-windows-msvc.zip" rga.zip da03e969ac01839443739c547ca8eb521e648e712251d61a98d34a1521b9f43b
          Baixa "https://github.com/oschwartz10612/poppler-windows/releases/download/v$env:POPPLERV/Release-$env:POPPLERV.zip" poppler.zip 7a6f256a0ddf7536182246a5733331bf4677cbcc34f4663774947ad34556c8d0
          Get-ChildItem _dl -Recurse -Include rg.exe, fd.exe, rga.exe, rga-preproc.exe | Copy-Item -Destination bin
          # pdftotext + as DLLs do poppler juntos: o rga acha o pdftotext pelo
          # PATH, e rga_env() põe a pasta do rg (bin\) no PATH dele
          $pop = Get-ChildItem _dl\poppler -Recurse -Filter pdftotext.exe | Select-Object -First 1
          Copy-Item "$($pop.DirectoryName)\*" -Destination bin -Recurse
          # Licenças de terceiros (AGPL-3 do rga e GPL-2 do Poppler são obrigatórias)
          New-Item -ItemType Directory -Force bin\licenses | Out-Null
          $rgaLic = Get-ChildItem _dl\rga -Recurse -Include LICENSE* | Select-Object -First 1
          if (-not $rgaLic) { throw "LICENSE do ripgrep-all não encontrado no zip" }
          Copy-Item $rgaLic.FullName "bin\licenses\ripgrep-all-LICENSE.md"
          $popLic = Get-ChildItem _dl\poppler -Recurse -Include COPYING*, LICENSE* | Select-Object -First 1
          if (-not $popLic) { throw "COPYING/LICENSE do Poppler não encontrado no zip" }
          Copy-Item $popLic.FullName "bin\licenses\poppler-COPYING"
          $rgLic = Get-ChildItem _dl\rg -Recurse -Include LICENSE*, UNLICENSE* | Select-Object -First 1
          if ($rgLic) { Copy-Item $rgLic.FullName "bin\licenses\ripgrep-LICENSE" }
          $fdLic = Get-ChildItem _dl\fd -Recurse -Include LICENSE* | Select-Object -First 1
          if ($fdLic) { Copy-Item $fdLic.FullName "bin\licenses\fd-LICENSE" }
          foreach ($e in "rg", "fd", "rga") { & "bin\$e.exe" --version | Select-Object -First 1 }
          if (-not (Test-Path bin\pdftotext.exe)) { throw "pdftotext.exe faltando" }
          exit 0          # o último nativo deixaria $LASTEXITCODE do poppler

      - name: dependências Python
        run: python -m pip install --disable-pip-version-check PySide6

      - name: costura de plataforma (test_plataforma_f0)
        run: python tests\test_plataforma_f0.py

      - name: aceite F0 — busca por nome com fd.exe real
        run: |
          $ErrorActionPreference = "Stop"
          $d = Join-Path $env:RUNNER_TEMP "sfs_f0"
          New-Item -ItemType Directory -Force "$d\sub" | Out-Null
          "laudo" | Set-Content "$d\a.txt"; "laudo" | Set-Content "$d\sub\b.txt"; "x" | Set-Content "$d\c.md"
          $out = python lfs\cli.py $d -n "*.txt" -l
          $out
          if ($LASTEXITCODE -ne 0) { throw "cli saiu $LASTEXITCODE" }
          if (@($out | Where-Object { $_ -like "*.txt" }).Count -ne 2) { throw "esperava 2 .txt" }
          $out = python lfs\cli.py $d -c laudo -l
          $out
          if (@($out | Where-Object { $_ -like "*.txt" }).Count -ne 2) { throw "conteúdo: esperava 2" }

      - name: paridade rg ↔ Python (test_parity_rg_python)
        run: python tests\test_parity_rg_python.py

      # F3: o pacote portátil (vai num pendrive). Monta com PyInstaller (onedir,
      # SombreroFileSearch.exe + sfs.exe) e prova o EXECUTÁVEL, não o código-fonte: nome, conteúdo
      # e documento (.docx pelo rga -> sfs.exe --docs-adapter).
      - name: pacote Windows (F3)
        run: |
          python -m pip install --disable-pip-version-check pyinstaller pillow
          .\packaging\windows\build_windows.ps1

      - name: aceite F3 — o executável empacotado busca de verdade
        run: |
          $ErrorActionPreference = "Stop"
          $sfs = "dist\SombreroFileSearch\sfs.exe"
          $d = Join-Path $env:RUNNER_TEMP "sfs_f3"
          New-Item -ItemType Directory -Force "$d\sub" | Out-Null
          "laudo" | Set-Content "$d\a.txt"; "laudo" | Set-Content "$d\sub\b.txt"
          python packaging\windows\faz_docx.py "$d\relatorio.docx" "parecer pulmonar"
          & $sfs --version
          $out = & $sfs $d -n "*.txt" -l; $out
          if (@($out | Where-Object { $_ -like "*.txt" }).Count -ne 2) { throw "nome: esperava 2 .txt" }
          $out = & $sfs $d -c laudo -l; $out
          if (@($out | Where-Object { $_ -like "*.txt" }).Count -ne 2) { throw "conteúdo: esperava 2" }
          $out = & $sfs $d -c pulmonar -D -l; $out
          if (-not ($out | Where-Object { $_ -like "*relatorio.docx" })) { throw "docx: o leitor embutido não respondeu" }
          # saída CAPTURADA no código de página do console (27/10/2026): no pt-BR o
          # PowerShell lê o pipe em cp850 e `relatório` voltava `relat├│rio` (Test-Path False)
          $nome = "relat$([char]0xF3)rio S$([char]0xE3)o Jos$([char]0xE9).txt"
          "x" | Set-Content -LiteralPath (Join-Path $d $nome)
          $antes = [Console]::OutputEncoding
          foreach ($cp in 850, 65001) {
            [Console]::OutputEncoding = [Text.Encoding]::GetEncoding($cp)
            $out = @(& $sfs $d -n "relat" -l | Where-Object { $_ })
            $out
            if ($out.Count -ne 2) { throw "cp${cp}: esperava 2 caminhos (txt + docx), veio $($out.Count)" }
            $out | ForEach-Object { if (-not (Test-Path -LiteralPath $_)) { throw "cp${cp}: caminho capturado não existe: $_" } }
            $js = @(& $sfs $d -n "relat" --json | ConvertFrom-Json | Where-Object { $_.path })
            if ($js.Count -ne 2) { throw "cp${cp}: --json esperava 2" }
            $js | ForEach-Object { if (-not (Test-Path -LiteralPath $_.path)) { throw "cp${cp}: --json caminho não existe: $($_.path)" } }
          }
          [Console]::OutputEncoding = $antes
          # a janela monta de verdade (o console diz o erro que o SombreroFileSearch.exe não teria onde dizer)
          foreach ($f in "licenses\README.txt", "licenses\ripgrep-all-LICENSE.md", "licenses\poppler-COPYING", "README-Windows.txt") {
            if (-not (Test-Path "dist\SombreroFileSearch\$f")) { throw "$f faltando no pacote" }
          }
          & $sfs --gui-selftest
          if ($LASTEXITCODE -ne 0) { throw "gui-selftest falhou ($LASTEXITCODE)" }
          # e o SombreroFileSearch.exe de janela sobe e fica de pé — com TODO aviso do Qt
          # ligado: exe de janela não tem stderr, e um aviso já derrubou a GUI (05/10/2026)
          $env:QT_LOGGING_RULES = "*.debug=true"
          $p = Start-Process "dist\SombreroFileSearch\SombreroFileSearch.exe" -PassThru
          Remove-Item Env:QT_LOGGING_RULES
          Start-Sleep 8
          if ($p.HasExited) {
            Get-Content "$env:LOCALAPPDATA\Sombrero File Search\crash.log" -ErrorAction SilentlyContinue
            Get-Content "$env:LOCALAPPDATA\Sombrero File Search\queda.log" -Tail 40 -ErrorAction SilentlyContinue
            throw "SombreroFileSearch.exe saiu sozinho (código $($p.ExitCode))"
          }
          Stop-Process $p
          exit 0

      # 24/11/2026 (pedido do Rodrigo): integridade da distribuição. Roda DEPOIS do
      # aceite de propósito: usar o programa não pode sujar a pasta do pacote.
      - name: integridade — sfs.exe --verify (íntegro 0, 1 byte estragado 1, sem manifesto 2)
        run: |
          $pkg = "dist\SombreroFileSearch"
          if (-not (Test-Path "$pkg\MANIFEST.sha256")) { throw "MANIFEST.sha256 faltando no pacote" }
          & "$pkg\sfs.exe" --verify
          if ($LASTEXITCODE -ne 0) { throw "pacote recem-montado: --verify saiu $LASTEXITCODE (esperado 0)" }
          # numa CÓPIA (o zip e a pasta original ficam como estão)
          $c = Join-Path $env:RUNNER_TEMP "sfs_integridade"
          Copy-Item -Recurse $pkg $c
          $f = Join-Path $c "bin\fd.exe"
          $b = [IO.File]::ReadAllBytes($f); $b[100] = $b[100] -bxor 0xFF; [IO.File]::WriteAllBytes($f, $b)
          $out = & "$c\sfs.exe" --verify 2>&1 | Out-String
          $rc = $LASTEXITCODE; $out
          if ($rc -ne 1) { throw "1 byte estragado em bin\fd.exe: --verify saiu $rc (esperado 1)" }
          if ($out -notmatch "MODIFIED: bin/fd\.exe") { throw "o relatorio nao apontou bin/fd.exe" }
          Remove-Item (Join-Path $c "MANIFEST.sha256")
          & "$c\sfs.exe" --verify 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2) { throw "sem manifesto: --verify saiu $LASTEXITCODE (esperado 2)" }
          exit 0

      # 24/11/2026: caminho longo MEDIDO, não simulado. Política desligada, raiz curta,
      # árvore > 300 caracteres. Informativo até a primeira medição (depois vira obrigatório).
      - name: aceite — caminho longo com LongPathsEnabled=0 (informativo)
        continue-on-error: true
        run: |
          $key = "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem"
          $orig = (Get-ItemProperty $key).LongPathsEnabled
          "LongPathsEnabled original: $orig"
          $rc = 1
          Set-ItemProperty $key LongPathsEnabled 0
          try {
            python tests\aceite_caminho_longo_win.py "dist\SombreroFileSearch\sfs.exe"
            $rc = $LASTEXITCODE
          } finally {
            if ($null -ne $orig) { Set-ItemProperty $key LongPathsEnabled $orig }
            else { Remove-ItemProperty $key LongPathsEnabled -ErrorAction SilentlyContinue }
          }
          exit $rc

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: SombreroFileSearch-windows-x64
          path: dist/SombreroFileSearch-*-windows-x64.zip
          retention-days: 30

      # Informativo na F0: lista o que ainda é só-Linux. Vira obrigatório na F1,
      # com cada falha Windows-only pinada em LACUNAS_CONHECIDAS.
      - name: auditoria e demais suítes (informativo)
        continue-on-error: true
        env:
          PYTHONFAULTHANDLER: "1"    # queda nativa (0xC0000409) deixa a pilha Python no log
          PYTHONUNBUFFERED: "1"      # ...e o que já tinha sido impresso não morre no buffer
        run: |
          $falhas = @()
          Get-ChildItem tests -Filter test_*.py | Sort-Object Name | ForEach-Object {
            python $_.FullName *> "_dl\$($_.BaseName).log"
            $rc = $LASTEXITCODE
            "{0,3}  {1}" -f $rc, $_.Name
            if ($rc -ne 0) { $falhas += $_.Name; Get-Content "_dl\$($_.BaseName).log" | Select-String -Pattern '^(FALHA|FALHOU|ERRO|Traceback)' | Select-Object -First 40 }
          }
          "--- suítes com falha no Windows: $($falhas.Count)"
          $falhas
          if ($falhas.Count) { exit 1 }

      # 24/11/2026: o log do passo acima só mostra a 1ª linha de cada falha; os
      # logs inteiros sumiam com o runner. Guardados para diagnosticar sem Windows.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: logs-suites-windows
          path: _dl/test_*.log
          if-no-files-found: warn
          retention-days: 14
